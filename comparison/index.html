<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roadmap vs Schedule Comparison</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="/shared/theme.css" />
<link rel="stylesheet" href="/shared/components.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Roadmap vs Schedule Comparison</h1>
    <div class="topbar-actions">
      <span id="file-status" class="file-status">Connecting...</span>
      <span id="save-status" class="save-status"></span>
      <div class="legend" aria-label="Legend">
        <span class="legend-item"><span class="legend-swatch legend-swatch-line"></span>Roadmap</span>
        <span class="legend-item"><span class="legend-swatch legend-swatch-bar"></span>Schedule A</span>
      </div>
      <div class="start-date-control">
        <label for="start-date-input">Start</label>
        <input type="date" id="start-date-input" class="input" title="Timeline start date (snaps back to the Monday of that week)">
      </div>
      <div class="zoom-toggle" role="group" aria-label="Timeline zoom">
        <button type="button" id="zoom-out-btn" class="zoom-btn" title="Zoom out">−</button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button type="button" id="zoom-in-btn" class="zoom-btn" title="Zoom in">+</button>
      </div>
    </div>
  </header>

  <div id="filter-panel" class="filter-panel">
    <button type="button" id="filter-toggle-btn" class="filter-toggle-btn" aria-expanded="true" aria-controls="filter-panel-body">
      <span class="filter-toggle-caret" aria-hidden="true">▾</span>
      <span>Filter</span>
      <span id="filter-active-badge" class="filter-active-badge" hidden></span>
    </button>
    <div id="filter-panel-body" class="filter-panel-body">
      <div class="filter-row">
        <span class="filter-row-label">Team</span>
        <div id="filter-team-row" class="filter-pill-list"></div>
      </div>
      <div class="filter-row">
        <span class="filter-row-label">Phase</span>
        <div id="filter-phase-row" class="filter-pill-list"></div>
      </div>
      <div class="filter-row filter-search-row">
        <div class="filter-search-wrap">
          <input type="text" id="filter-search-input" class="input filter-search-input" placeholder="Search projects by title…" autocomplete="off" aria-label="Search projects by title" />
          <ul id="filter-search-results" class="filter-search-results" hidden></ul>
        </div>
        <button type="button" id="filter-clear-btn" class="btn filter-clear-btn">Clear filters</button>
      </div>
    </div>
  </div>

  <main class="compare-wrap">
    <div id="empty-state" class="empty-state">
      <p>Loading comparison...</p>
    </div>
    <div id="table-scroll" class="table-scroll" hidden>
      <div class="table-inner">
        <div id="today-line" class="today-line" hidden></div>
        <table id="compare-table" class="compare-table">
          <colgroup id="col-group"></colgroup>
          <thead>
            <tr id="month-row" class="month-row"></tr>
            <tr id="week-row" class="week-row"></tr>
          </thead>
          <tbody id="compare-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>window.AUTH_REQUIREMENTS = [
    { project: 'roadmap-db', role: 'viewer' },
    { project: 'schedule-a-db-v2', role: 'viewer' }
  ];</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/shared/auth-gate.js"></script>
  <script src="/app-tabs.js"></script>
  <script src="app.js"></script>
</body>
</html>
