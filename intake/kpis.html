<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How well are we doing?</title>
<link rel="icon" type="image/svg+xml" href="kpi-favicon.svg">
<script>
  // ?embed=1 is used when this page is loaded inside dashboard/dashboard.html's
  // iframe: it hides the page chrome (heading, buttons) so only the tiles show.
  // Set on <html> (not <body>) so it's available before body parses.
  if (new URLSearchParams(location.search).get("embed") === "1") {
    document.documentElement.classList.add("embed-mode");
  }
</script>
<style>
  :root {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.06), 0 1px 1px rgba(20, 24, 30, 0.04);

    --status-good: #33CC66;
    --status-warning: #FF9900;
    --status-critical: #FF3300;

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C;
      --surface: #1C2027;
      --surface-alt: #20242C;
      --border: #2C313B;
      --text: #E8EAED;
      --text-muted: #99A0AC;
      --text-faint: #6B717C;
      --accent: #3FC7B3;
      --accent-contrast: #0A1512;
      --accent-tint: #3FC7B326;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C;
    --surface: #1C2027;
    --surface-alt: #20242C;
    --border: #2C313B;
    --text: #E8EAED;
    --text-muted: #99A0AC;
    --text-faint: #6B717C;
    --accent: #3FC7B3;
    --accent-contrast: #0A1512;
    --accent-tint: #3FC7B326;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-top: 34px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .btn-primary:hover { filter: brightness(1.06); }

  .app {
    height: calc(100vh - 34px);
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex: none;
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.2px;
    margin: 0;
    text-wrap: balance;
  }
  .topbar .sub {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .file-status {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(5, minmax(200px, 1fr));
    gap: 16px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--tile-status-color, var(--border));
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .tile-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .tile-value {
    font-family: var(--font-body);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
    color: var(--text);
  }
  .tile-value .unit {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    margin-left: 6px;
  }
  .tile-empty .tile-value {
    color: var(--text-faint);
  }
  .tile-caption {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.4;
  }
  .meter {
    position: relative;
    margin: 14px 0 2px;
  }
  .meter-track {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--border);
  }
  .meter-segment {
    height: 100%;
  }
  .meter-critical { background: var(--status-critical); }
  .meter-warning { background: var(--status-warning); }
  .meter-good { background: var(--status-good); }
  .meter-marker {
    position: absolute;
    top: 50%;
    left: 0;
    width: 2px;
    height: 14px;
    background: var(--text);
    border-radius: 1px;
    transform: translate(-50%, -50%);
  }
  @media (max-width: 1100px) {
    .tiles {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }
  }

  html.embed-mode body { padding-top: 0; }
  html.embed-mode .app { height: auto; }
  html.embed-mode .topbar,
  html.embed-mode #auth-gate-bar { display: none !important; }
</style>
</head><body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>How well are we doing?</h1><span class="sub">Today's delivery pipeline metrics</span>
    </div>
    <div class="topbar-actions">
      <span class="file-status" id="syncStatusLabel"></span>
      <a class="btn" href="intake-full-kpis.html">Goto Full KPIs</a>
      <button class="btn btn-primary" id="btnPublish">Publish</button>
    </div>
  </div>

  <div class="main">
    <div class="tiles" id="tiles"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.AUTH_REQUIREMENTS = [{ project: 'intake', role: 'viewer' }];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-gate.js"></script>
<script>
(function () {
  "use strict";

  var TABLE = "intake_cards";
  var sb = window.sbClient;

  var STORAGE_KEY = "intake-tracker-v1"; // local cache only, used if Supabase is unreachable

  function daysAgo(n) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - n);
    return d;
  }

  var CURRENT_WINDOW = { from: daysAgo(92), to: daysAgo(0) };

  var KPIS = [
    {
      id: "in-process",
      label: "In Process",
      IN_PROCESS_INTAKE: ["TechHub", "Meeting", "Technology", "Bug"],
      thresholds: { good: 95, warning: 80 },
      showMeter: true,
      compute: function (cards, window) {
        window = window || CURRENT_WINDOW;
        var inProcessIntake = this.IN_PROCESS_INTAKE;
        var total = 0;
        var inProcess = 0;
        cards.forEach(function (c) {
          if (!c.dateReceived) return;
          var received = new Date(c.dateReceived + "T00:00:00");
          if (isNaN(received.getTime()) || received < window.from || received > window.to) return;
          total++;
          if (inProcessIntake.indexOf(c.intake) !== -1) inProcess++;
        });
        if (total === 0) return null;
        return { pct: (inProcess / total) * 100, inProcess: inProcess, total: total };
      },
      render: function (result) {
        return {
          value: result ? Math.round(result.pct) + "%" : "—",
          unit: "",
          caption: "How many requests are received through managed channels"
        };
      },
      status: function (result) {
        if (!result) return null;
        if (result.pct >= this.thresholds.good) return "good";
        if (result.pct >= this.thresholds.warning) return "warning";
        return "critical";
      }
    },
    {
      id: "responsiveness",
      label: "Responsiveness",
      thresholds: { good: 22, warning: 28 },
      showMeter: true,
      meterOptions: { max: 45, direction: "lower-better" },
      meterValue: function (result) { return result.value; },
      compute: function (cards, window) {
        window = window || CURRENT_WINDOW;
        var diffs = [];
        cards.forEach(function (c) {
          if (!c.dateReceived || !c.dateIpaSent) return;
          var received = new Date(c.dateReceived + "T00:00:00");
          var ipaSent = new Date(c.dateIpaSent + "T00:00:00");
          if (isNaN(received.getTime()) || isNaN(ipaSent.getTime())) return;
          if (received < window.from || received > window.to) return;
          diffs.push((ipaSent - received) / 86400000);
        });
        if (diffs.length === 0) return null;
        var avg = diffs.reduce(function (a, b) { return a + b; }, 0) / diffs.length;
        return { value: avg, count: diffs.length };
      },
      render: function (result) {
        return {
          value: result ? result.value.toFixed(1) : "—",
          unit: result ? "days avg" : "",
          caption: "How quickly we respond with an estimate or plan"
        };
      },
      status: function (result) {
        if (!result) return null;
        if (result.value < this.thresholds.good) return "good";
        if (result.value <= this.thresholds.warning) return "warning";
        return "critical";
      }
    },
    {
      id: "thinking",
      label: "Big Thinking",
      thresholds: { good: 25, warning: 12 },
      showMeter: true,
      compute: function (cards, window) {
        window = window || CURRENT_WINDOW;
        var total = 0;
        var big = 0;
        cards.forEach(function (c) {
          if (!c.dateReceived) return;
          var received = new Date(c.dateReceived + "T00:00:00");
          if (isNaN(received.getTime()) || received < window.from || received > window.to) return;
          total++;
          if (c.bigThinking) big++;
        });
        if (total === 0) return null;
        return { pct: (big / total) * 100, big: big, total: total };
      },
      render: function (result) {
        return {
          value: result ? Math.round(result.pct) + "%" : "—",
          unit: "",
          caption: "How many requests we are able to offer a wider benefit"
        };
      },
      status: function (result) {
        if (!result) return null;
        if (result.pct >= this.thresholds.good) return "good";
        if (result.pct >= this.thresholds.warning) return "warning";
        return "critical";
      }
    },
    {
      id: "defined-benefit",
      label: "Defined Benefit",
      thresholds: { good: 90, warning: 80 },
      showMeter: true,
      compute: function (cards, window) {
        window = window || CURRENT_WINDOW;
        var total = 0;
        var defined = 0;
        cards.forEach(function (c) {
          if (!c.dateBusinessCaseReceived) return;
          var businessCase = new Date(c.dateBusinessCaseReceived + "T00:00:00");
          if (isNaN(businessCase.getTime()) || businessCase < window.from || businessCase > window.to) return;
          total++;
          if (c.definedBusinessBenefit) defined++;
        });
        if (total === 0) return null;
        return { pct: (defined / total) * 100, defined: defined, total: total };
      },
      render: function (result) {
        return {
          value: result ? Math.round(result.pct) + "%" : "—",
          unit: "",
          caption: "How many requests can identify the organoisational benefit"
        };
      },
      status: function (result) {
        if (!result) return null;
        if (result.pct >= this.thresholds.good) return "good";
        if (result.pct >= this.thresholds.warning) return "warning";
        return "critical";
      }
    },
    {
      id: "on-time-releases",
      label: "On Time Releases",
      thresholds: { good: 80, warning: 65 },
      showMeter: true,
      compute: function (cards, window) {
        window = window || CURRENT_WINDOW;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var total = 0;
        var onTime = 0;
        cards.forEach(function (c) {
          if (!c.promiseDate) return;
          var promise = new Date(c.promiseDate + "T00:00:00");
          if (isNaN(promise.getTime())) return;
          var anchor, isOnTime;
          if (c.releaseDate) {
            var release = new Date(c.releaseDate + "T00:00:00");
            if (isNaN(release.getTime())) return;
            anchor = release;
            isOnTime = release <= promise;
          } else {
            if (promise >= today) return; // not yet due — can't judge yet
            anchor = promise;
            isOnTime = false; // past-due promise date with no release is a fail
          }
          if (anchor < window.from || anchor > window.to) return;
          total++;
          if (isOnTime) onTime++;
        });
        if (total === 0) return null;
        return { pct: (onTime / total) * 100, onTime: onTime, total: total };
      },
      render: function (result) {
        return {
          value: result ? Math.round(result.pct) + "%" : "—",
          unit: "",
          caption: "How often we deliver by the promised date"
        };
      },
      status: function (result) {
        if (!result) return null;
        if (result.pct >= this.thresholds.good) return "good";
        if (result.pct >= this.thresholds.warning) return "warning";
        return "critical";
      }
    }
  ];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  function loadCardsFromLocalStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function fetchCardsFromSupabase() {
    return sb.from(TABLE).select("id, data").then(function (res) {
      if (res.error) throw res.error;
      var cards = res.data.map(function (row) {
        var card = Object.assign({}, row.data);
        card.id = row.id;
        return card;
      });
      cards.sort(function (a, b) { return (a.position || 0) - (b.position || 0); });
      return cards;
    });
  }

  function cacheCardsLocally(cards) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    } catch (e) { /* ignore quota errors */ }
  }

  function buildMeterHtml(value, thresholds, opts) {
    opts = opts || {};
    var max = opts.max || 100;
    var zones = opts.direction === "lower-better"
      ? [
          { cls: "meter-good", upTo: thresholds.good },
          { cls: "meter-warning", upTo: thresholds.warning },
          { cls: "meter-critical", upTo: max }
        ]
      : [
          { cls: "meter-critical", upTo: thresholds.warning },
          { cls: "meter-warning", upTo: thresholds.good },
          { cls: "meter-good", upTo: max }
        ];
    var last = 0;
    var segmentsHtml = zones.map(function (z) {
      var width = Math.max(0, ((z.upTo - last) / max) * 100);
      last = z.upTo;
      return '<div class="meter-segment ' + z.cls + '" style="width:' + width + '%"></div>';
    }).join("");
    var markerPos = Math.max(0, Math.min(100, (value / max) * 100));
    return '<div class="meter">' +
      '<div class="meter-track">' + segmentsHtml + "</div>" +
      '<div class="meter-marker" style="left:' + markerPos + '%"></div>' +
    "</div>";
  }

  function renderTiles(cards) {
    var container = document.getElementById("tiles");
    container.innerHTML = "";
    KPIS.forEach(function (kpi) {
      var result = kpi.compute(cards);
      var view = kpi.render(result);
      var status = kpi.status ? kpi.status(result) : null;
      var tile = document.createElement("div");
      tile.className = "tile" + (result ? "" : " tile-empty");
      if (status) tile.style.setProperty("--tile-status-color", "var(--status-" + status + ")");
      tile.innerHTML =
        '<div class="tile-label">' + escapeHtml(kpi.label) + "</div>" +
        '<div class="tile-value">' + escapeHtml(view.value) +
          (view.unit ? ' <span class="unit">' + escapeHtml(view.unit) + "</span>" : "") +
        "</div>" +
        (kpi.showMeter && result ? buildMeterHtml(kpi.meterValue ? kpi.meterValue(result) : result.pct, kpi.thresholds, kpi.meterOptions) : "") +
        '<div class="tile-caption">' + escapeHtml(view.caption) + "</div>";
      container.appendChild(tile);
    });
  }

  function downloadText(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function loadImageElement(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image not found: " + url)); };
      img.src = url;
    });
  }

  // Uses an <img> + <canvas> round-trip rather than fetch(), because Chrome's
  // fetch() refuses to load file:// URLs at all (this page is often opened by
  // double-clicking it on disk, not served over http).
  function embedThumbnail(url) {
    return loadImageElement(url).then(function (img) {
      try {
        var canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        return canvas.toDataURL("image/jpeg", 0.92);
      } catch (e) {
        // Canvas export blocked (e.g. opaque file:// origin) — fall back to a
        // plain relative reference, which still displays as long as the
        // published file stays next to kpis-thumbnail.jpg.
        return url;
      }
    }).catch(function () {
      return null;
    });
  }

  function buildStandaloneHtml(tilesHtml, imageDataUri) {
    var css = document.querySelector("style").textContent;
    var imgHtml = imageDataUri
      ? '<div style="display:flex;justify-content:center;padding:20px 24px 0;background:var(--surface);">' +
          '<img src="' + imageDataUri + '" alt="" style="max-height:240px;height:auto;width:auto;display:block;">' +
        "</div>"
      : "";
    return "<!doctype html>\n" +
      '<html lang="en"><head>\n' +
      '<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      "<title>How well are we doing?</title>\n" +
      "<style>" + css + "</style>\n" +
      "</head><body>\n" +
      imgHtml +
      '<div class="app">\n' +
      '  <div class="topbar">\n' +
      "    <div><h1>How well are we doing?</h1><span class=\"sub\">Snapshot published " + escapeHtml(new Date().toLocaleString()) + "</span></div>\n" +
      "  </div>\n" +
      '  <div class="main"><div class="tiles">' + tilesHtml + "</div></div>\n" +
      "</div>\n" +
      "</body></html>\n";
  }

  function publishStandaloneHtml() {
    var container = document.getElementById("tiles");
    if (!container.children.length) { toast("Nothing to publish yet"); return; }
    embedThumbnail("kpis-thumbnail.jpg").then(function (imageSrc) {
      if (!imageSrc) toast("Publishing without thumbnail — kpis-thumbnail.jpg not found");
      var html = buildStandaloneHtml(container.innerHTML, imageSrc);
      var filename = "how-well-are-we-doing-" + new Date().toISOString().slice(0, 10) + ".html";
      downloadText(filename, html, "text/html");
      toast("Published " + filename);
    });
  }

  document.getElementById("btnPublish").addEventListener("click", publishStandaloneHtml);

  function updateStatusLabel(status) {
    var label = document.getElementById("syncStatusLabel");
    if (!label) return;
    if (status === "synced") label.textContent = "Synced with Supabase";
    else if (status === "offline") label.textContent = "Offline — showing cached copy";
    else if (status === "loading") label.textContent = "Loading…";
  }

  function loadFromBestSource() {
    updateStatusLabel("loading");
    fetchCardsFromSupabase().then(function (cards) {
      renderTiles(cards);
      cacheCardsLocally(cards);
      updateStatusLabel("synced");
    }).catch(function (err) {
      toast("Couldn't load from Supabase: " + err.message);
      renderTiles(loadCardsFromLocalStorage());
      updateStatusLabel("offline");
    });
  }

  window.onAuthReady(loadFromBestSource);
})();
</script>


</body></html>
