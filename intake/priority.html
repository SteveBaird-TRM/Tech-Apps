<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Priority Dashboard</title>
<link rel="icon" type="image/svg+xml" href="priority-favicon.svg">
<style>
  :root {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
    --bar-track: #DBE0E7;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.06), 0 1px 1px rgba(20, 24, 30, 0.04);

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C;
      --surface: #1C2027;
      --surface-alt: #20242C;
      --border: #2C313B;
      --text: #E8EAED;
      --text-muted: #99A0AC;
      --text-faint: #6B717C;
      --accent: #3FC7B3;
      --accent-contrast: #0A1512;
      --accent-tint: #3FC7B326;
      --bar-track: #2C313B;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C;
    --surface: #1C2027;
    --surface-alt: #20242C;
    --border: #2C313B;
    --text: #E8EAED;
    --text-muted: #99A0AC;
    --text-faint: #6B717C;
    --accent: #3FC7B3;
    --accent-contrast: #0A1512;
    --accent-tint: #3FC7B326;
    --bar-track: #2C313B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
    --bar-track: #DBE0E7;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-top: 34px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex: none;
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.2px;
    margin: 0;
    text-wrap: balance;
  }
  .topbar .sub {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .file-status {
    font-size: 12px;
    color: var(--text-faint);
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
  }
  .btn:hover { background: var(--surface-alt); }

  .main {
    flex: 1;
    padding: 20px 24px 40px;
    overflow-x: auto;
  }

  table.scoring {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    min-width: 900px;
  }
  table.scoring th, table.scoring td {
    padding: 10px 14px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.scoring th {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--text-faint);
    background: var(--surface-alt);
  }
  table.scoring tbody tr:last-child td { border-bottom: none; }
  table.scoring tbody tr:hover td { background: var(--surface-alt); }

  .col-title {
    white-space: normal;
    min-width: 220px;
    font-weight: 500;
  }
  .col-score {
    text-align: center;
    width: 90px;
    font-variant-numeric: tabular-nums;
  }
  th.sortable {
    cursor: pointer;
    user-select: none;
  }
  th.sortable:hover {
    color: var(--text);
  }
  .sort-icon {
    display: inline-block;
    margin-left: 4px;
    font-size: 9px;
    width: 8px;
  }
  .sort-icon::after {
    content: "▽";
    opacity: 0.5;
  }
  th.sort-active .sort-icon::after {
    content: "▼";
    opacity: 1;
  }
  .score-empty {
    color: var(--text-faint);
  }
  .col-priority {
    text-align: center;
    width: 70px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .col-bar {
    width: 220px;
  }
  .bar-track {
    position: relative;
    width: 100%;
    height: 10px;
    background: var(--bar-track);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    background: var(--accent);
    border-radius: 5px;
  }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Priority Dashboard</h1><span class="sub">Strategic / Operational / Commercial / Customer scores</span>
    </div>
    <div class="topbar-actions">
      <span class="file-status" id="syncStatusLabel"></span>
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty-state" id="emptyState" style="display:none;">No scored requests yet.</div>
    <table class="scoring" id="scoringTable" style="display:none;">
      <thead>
        <tr>
          <th class="col-title sortable" data-sort-key="title">Request<span class="sort-icon"></span></th>
          <th class="col-score sortable" data-sort-key="strategicScore">Strategic<span class="sort-icon"></span></th>
          <th class="col-score sortable" data-sort-key="operationalScore">Operational<span class="sort-icon"></span></th>
          <th class="col-score sortable" data-sort-key="customerScore">Customer<span class="sort-icon"></span></th>
          <th class="col-score sortable" data-sort-key="commercialScore">Commercial<span class="sort-icon"></span></th>
          <th class="col-priority sortable" data-sort-key="priority">Priority<span class="sort-icon"></span></th>
          <th class="col-bar">Priority</th>
        </tr>
      </thead>
      <tbody id="scoringBody"></tbody>
    </table>
  </div>
</div>

<script>window.AUTH_REQUIREMENTS = [{ project: 'intake', role: 'viewer' }];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-gate.js"></script>
<script>
(function () {
  "use strict";

  var TABLE = "intake_cards";
  var sb = window.sbClient;
  var STORAGE_KEY = "intake-tracker-v1"; // shared local cache, used if Supabase is unreachable

  var SCORE_FIELDS = [
    { key: "strategicScore", label: "Strategic" },
    { key: "operationalScore", label: "Operational" },
    { key: "customerScore", label: "Customer" },
    { key: "commercialScore", label: "Commercial" }
  ];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function setSyncStatus(status, detail) {
    var label = document.getElementById("syncStatusLabel");
    if (!label) return;
    if (status === "loading") label.textContent = "Loading…";
    else if (status === "synced") label.textContent = "Synced with Supabase";
    else if (status === "offline") label.textContent = "Offline — showing cached copy" + (detail ? " (" + detail + ")" : "");
  }

  function loadCardsFromLocalStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function cacheCardsLocally(cards) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    } catch (e) { /* ignore quota errors */ }
  }

  function fetchCardsFromSupabase() {
    return sb.from(TABLE).select("id, data").then(function (res) {
      if (res.error) throw res.error;
      return res.data.map(function (row) {
        var card = Object.assign({}, row.data);
        card.id = row.id;
        return card;
      });
    });
  }

  // A score only counts toward the average if it's a positive number (0 and blank both mean "not scored").
  function scoredValue(card, key) {
    var raw = card[key];
    if (raw === "" || raw === null || raw === undefined) return null;
    var num = Number(raw);
    if (isNaN(num) || num <= 0) return null;
    return num;
  }

  function computePriority(card) {
    var sum = 0, count = 0;
    SCORE_FIELDS.forEach(function (f) {
      var v = scoredValue(card, f.key);
      if (v != null) { sum += v; count++; }
    });
    if (count === 0) return null;
    return sum / count;
  }

  var currentSortKey = "priority"; // default sort column
  var lastRows = [];

  function compareRows(a, b, key) {
    if (key === "title") {
      var at = (a.card.projectTitle || "Untitled request").toLowerCase();
      var bt = (b.card.projectTitle || "Untitled request").toLowerCase();
      if (at !== bt) return at < bt ? -1 : 1;
    } else if (key && key !== "priority") {
      var av = scoredValue(a.card, key);
      var bv = scoredValue(b.card, key);
      // unscored (0/blank) sinks to the bottom within this column's sort
      var an = av == null ? -1 : av;
      var bn = bv == null ? -1 : bv;
      if (bn !== an) return bn - an;
    }
    if (b.priority !== a.priority) return b.priority - a.priority;
    var ad = a.card.dateReceived || "";
    var bd = b.card.dateReceived || "";
    if (ad !== bd) return ad < bd ? -1 : 1;
    return 0;
  }

  function buildRow(card, priority) {
    var tr = document.createElement("tr");

    var titleTd = document.createElement("td");
    titleTd.className = "col-title";
    titleTd.textContent = card.projectTitle || "Untitled request";
    tr.appendChild(titleTd);

    SCORE_FIELDS.forEach(function (f) {
      var td = document.createElement("td");
      td.className = "col-score";
      var v = scoredValue(card, f.key);
      if (v == null) {
        td.className += " score-empty";
        td.textContent = "—";
      } else {
        td.textContent = v;
      }
      tr.appendChild(td);
    });

    var priorityTd = document.createElement("td");
    priorityTd.className = "col-priority";
    priorityTd.textContent = Math.round(priority);
    tr.appendChild(priorityTd);

    var barTd = document.createElement("td");
    barTd.className = "col-bar";
    var track = document.createElement("div");
    track.className = "bar-track";
    var fill = document.createElement("div");
    fill.className = "bar-fill";
    fill.style.width = Math.max(0, Math.min(100, priority)) + "%";
    track.appendChild(fill);
    barTd.appendChild(track);
    tr.appendChild(barTd);

    return tr;
  }

  function renderTable(cards) {
    var rows = [];
    cards.forEach(function (card) {
      if (card.status === "delivered" || card.status === "rejected") return;
      var priority = computePriority(card);
      if (priority == null) return; // no scores entered — hide the request
      rows.push({ card: card, priority: priority });
    });
    lastRows = rows;
    renderSortedRows();
  }

  function renderSortedRows() {
    var rows = lastRows.slice().sort(function (a, b) { return compareRows(a, b, currentSortKey); });

    var table = document.getElementById("scoringTable");
    var empty = document.getElementById("emptyState");
    var body = document.getElementById("scoringBody");
    body.innerHTML = "";

    document.querySelectorAll("th.sortable").forEach(function (th) {
      th.classList.toggle("sort-active", th.dataset.sortKey === currentSortKey);
    });

    if (rows.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }

    table.style.display = "";
    empty.style.display = "none";
    rows.forEach(function (r) {
      body.appendChild(buildRow(r.card, r.priority));
    });
  }

  document.querySelectorAll("th.sortable").forEach(function (th) {
    th.addEventListener("click", function () {
      currentSortKey = th.dataset.sortKey;
      renderSortedRows();
    });
  });

  function loadFromBestSource() {
    setSyncStatus("loading");
    fetchCardsFromSupabase().then(function (cards) {
      renderTable(cards);
      cacheCardsLocally(cards);
      setSyncStatus("synced");
    }).catch(function (err) {
      renderTable(loadCardsFromLocalStorage());
      setSyncStatus("offline", err.message);
    });
  }

  document.getElementById("btnRefresh").addEventListener("click", loadFromBestSource);

  window.onAuthReady(loadFromBestSource);
})();
</script>
</body>
</html>
