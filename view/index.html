<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects Listing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
    --danger: #C0362C;
    --danger-tint: #C0362C1A;
    --amber: #B4790E;
    --amber-tint: #B4790E1A;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.06), 0 1px 1px rgba(20, 24, 30, 0.04);

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C; --surface: #1C2027; --surface-alt: #20242C; --border: #2C313B;
      --text: #E8EAED; --text-muted: #99A0AC; --text-faint: #6B717C;
      --accent: #3FC7B3; --accent-contrast: #0A1512; --accent-tint: #3FC7B326;
      --danger: #F0685F; --danger-tint: #F0685F26;
      --amber: #E0A93F; --amber-tint: #E0A93F26;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C; --surface: #1C2027; --surface-alt: #20242C; --border: #2C313B;
    --text: #E8EAED; --text-muted: #99A0AC; --text-faint: #6B717C;
    --accent: #3FC7B3; --accent-contrast: #0A1512; --accent-tint: #3FC7B326;
    --danger: #F0685F; --danger-tint: #F0685F26;
    --amber: #E0A93F; --amber-tint: #E0A93F26;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] {
    --bg: #EAEDF1; --surface: #FFFFFF; --surface-alt: #F2F4F7; --border: #DBE0E7;
    --text: #191D23; --text-muted: #5E6572; --text-faint: #9BA1AC;
    --accent: #0E7A6C; --accent-contrast: #FFFFFF; --accent-tint: #0E7A6C1A;
    --danger: #C0362C; --danger-tint: #C0362C1A;
    --amber: #B4790E; --amber-tint: #B4790E1A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }

  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
    flex: none; flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 22px;
    letter-spacing: 0.2px; margin: 0;
  }
  .topbar .sub { font-size: 12.5px; color: var(--text-muted); margin-left: 10px; }

  .main { flex: 1; display: flex; justify-content: center; padding: 28px 24px 60px; }
  .panel { width: 100%; max-width: 1000px; }

  .notice {
    border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; font-size: 13.5px;
    line-height: 1.5;
  }
  .notice-error { background: var(--danger-tint); border: 1px solid var(--danger); color: var(--danger); }
  .notice-hidden { display: none; }

  .projects-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  table.open-projects-table { width: 100%; border-collapse: collapse; }
  .open-projects-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint); font-weight: 600; padding: 10px 14px;
    border-bottom: 1px solid var(--border); background: var(--surface-alt); white-space: nowrap;
  }
  .open-projects-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .open-projects-table tr:last-child td { border-bottom: none; }
  .open-projects-table td.col-health { width: 1%; }
  .open-projects-table td.col-phase { white-space: nowrap; }
  .open-projects-table th.sortable { cursor: pointer; user-select: none; }
  .open-projects-table th.sortable:hover { color: var(--text-muted); }
  .open-projects-table th.sortable.active { color: var(--accent); }
  .sort-arrow { display: inline-block; width: 10px; margin-left: 4px; font-size: 9px; color: var(--accent); }
  .project-title { font-weight: 500; }
  .project-title-name { font-weight: 500; }
  .project-people { font-size: 11px; font-weight: 400; color: var(--text-faint); margin-top: 2px; }
  .empty-note { padding: 20px 16px; font-size: 13px; color: var(--text-faint); font-style: italic; }

  .health-tag {
    display: inline-block; width: 7px; height: 18px; border-radius: 3px;
    background: var(--border);
  }
  .health-green { background: #4FCE65; }
  .health-amber { background: #FFC148; }
  .health-red { background: #FF4853; }

  .phase-cell { display: inline-flex; align-items: center; gap: 7px; }
  .phase-icon { width: 14px; height: 14px; flex: none; }
  :root[data-theme="dark"] .phase-icon { filter: invert(1) brightness(1.7); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .phase-icon { filter: invert(1) brightness(1.7); }
  }

  .filters-block { border-bottom: 1px solid var(--border); background: var(--surface-alt); }
  .filters-block-header { display: flex; align-items: center; gap: 4px; padding: 10px 14px; }
  .filters-block-header .filter-block-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint); font-weight: 600;
  }
  .filters-block-body { padding: 0 14px 12px; }
  .filter-row { margin-bottom: 10px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-row-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip {
    font: inherit; font-size: 11px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    cursor: pointer;
  }
  .filter-chip:hover { background: var(--accent-tint); }
  .filter-chip.active {
    background: var(--accent-tint); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .collapse-toggle {
    flex: none; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-muted); font-size: 15px; line-height: 1;
    cursor: pointer; border-radius: 4px; transition: transform .15s;
  }
  .collapse-toggle:hover { background: var(--surface); }
  .collapse-toggle.collapsed { transform: rotate(-90deg); }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border: 1px solid transparent; background: transparent;
    color: var(--text-faint); border-radius: 7px; padding: 0;
  }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn:hover { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn:disabled:hover { background: transparent; color: var(--text-faint); border-color: transparent; }

  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: default; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 17, 21, 0.5); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-dialog {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); width: 360px; max-width: 100%; padding: 20px;
  }
  .modal-dialog h3 {
    font-family: var(--font-display); font-weight: 400; font-size: 17px; margin: 0 0 16px;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-field label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint); font-weight: 600; margin-bottom: 5px;
  }
  .modal-field select, .modal-field input[type="text"] {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface-alt);
    color: var(--text); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .modal-error { color: var(--danger); font-size: 12.5px; margin-top: -6px; margin-bottom: 10px; min-height: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Projects Listing</h1><span class="sub">Health, phase, and timing pulled live from the roadmap</span>
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <div id="loadError" class="notice notice-error notice-hidden"></div>

      <div class="projects-card">
        <div class="filters-block" id="filtersBlock">
          <div class="filters-block-header">
            <button type="button" class="collapse-toggle" id="filtersCollapseToggle" title="Collapse filters">▾</button>
            <div class="filter-block-label">Filters</div>
          </div>
          <div class="filters-block-body" id="filtersBlockBody">
            <div class="filter-row">
              <div class="filter-row-label">Phase</div>
              <div class="filter-chips" id="phaseFilterChips"></div>
            </div>
            <div class="filter-row">
              <div class="filter-row-label">Team</div>
              <div class="filter-chips" id="teamFilterChips"></div>
            </div>
            <div class="filter-row">
              <div class="filter-row-label">PM</div>
              <div class="filter-chips" id="pmFilterChips"></div>
            </div>
            <div class="filter-row">
              <div class="filter-row-label">BA</div>
              <div class="filter-chips" id="baFilterChips"></div>
            </div>
          </div>
        </div>
        <table class="open-projects-table">
          <thead>
            <tr>
              <th class="sortable" data-sort-key="health">Health<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="phase">Phase<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="title">Title<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="team">Team<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="start">Start<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="end">End<span class="sort-arrow"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>window.AUTH_REQUIREMENTS = [{ project: 'roadmap-db', role: 'viewer' }];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-gate.js"></script>
<script>
(function () {
  "use strict";

  var TEAM_OPTIONS = ["Cyber", "Data and BI", "Delivery", "Development", "Digital Tech", "Ecommerce", "Enterprise", "Operations"];
  var PHASE_ORDER = ["Not Started", "Discovery", "Build", "Test", "Blocked", "Complete"];
  var DEFAULT_PHASE = "Not Started";
  var PHASE_ICON_FILES = {
    "Not Started": "circle-0.svg",
    "Discovery": "circle-2.svg",
    "Build": "circle-4.svg",
    "Test": "circle-6.svg",
    "Blocked": "circle-blocked.svg",
    "Complete": "circle-8.svg"
  };
  var HEALTH_CLASSES = { Green: "health-green", Amber: "health-amber", Red: "health-red" };

  var HEALTH_ORDER = ["", "Green", "Amber", "Red"];
  var SORT_FALLBACK_CHAIN = ["phase", "start", "title"];

  var sb;
  var allRows = [];
  var sortState = { key: "phase", dir: "asc" };
  var teamFilter = null; // null = all teams; otherwise an array of selected team names ('' = no team)
  var phaseFilter = null; // null = all phases; otherwise an array of selected phase names
  var pmFilter = null; // null = all PMs; otherwise an array of selected PM names ('' = none)
  var baFilter = null; // null = all BAs; otherwise an array of selected BA names ('' = none)
  var filtersCollapsed = false;
  try {
    if (localStorage.getItem("projects-listing-filters-collapsed") === "1") filtersCollapsed = true;
  } catch (err) {}

  function normalizedPhase(phase) {
    return PHASE_ORDER.indexOf(phase) !== -1 ? phase : DEFAULT_PHASE;
  }

  function parseIsoDate(s) {
    var parts = String(s || "").split("-");
    if (parts.length !== 3) return null;
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return null;
    var date = new Date(y, m - 1, d);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function addDays(date, days) {
    var d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function fmtDate(d) {
    if (!d) return "—";
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function showError(msg) {
    var el = document.getElementById("loadError");
    el.textContent = msg;
    el.classList.toggle("notice-hidden", !msg);
  }

  function dateVal(d) {
    return d ? d.getTime() : Infinity;
  }

  function compareRaw(a, b, key) {
    switch (key) {
      case "health": return HEALTH_ORDER.indexOf(a.health) - HEALTH_ORDER.indexOf(b.health);
      case "phase": return PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase);
      case "title": return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
      case "team": return (a.team || "").toLowerCase().localeCompare((b.team || "").toLowerCase());
      case "start": return dateVal(a.start) - dateVal(b.start);
      case "end": return dateVal(a.end) - dateVal(b.end);
      default: return 0;
    }
  }

  function sortRows(rows) {
    var chain = [sortState.key];
    SORT_FALLBACK_CHAIN.forEach(function (k) {
      if (chain.indexOf(k) === -1) chain.push(k);
    });

    rows.sort(function (a, b) {
      for (var i = 0; i < chain.length; i++) {
        var key = chain[i];
        var dir = key === sortState.key ? sortState.dir : "asc";
        var diff = compareRaw(a, b, key);
        if (dir === "desc") diff = -diff;
        if (diff !== 0) return diff;
      }
      return 0;
    });
    return rows;
  }

  function updateSortIndicators() {
    document.querySelectorAll(".open-projects-table thead th.sortable").forEach(function (th) {
      var key = th.getAttribute("data-sort-key");
      var arrow = th.querySelector(".sort-arrow");
      th.classList.toggle("active", key === sortState.key);
      arrow.textContent = key === sortState.key ? (sortState.dir === "asc" ? "▲" : "▼") : "";
    });
  }

  function attachSortHandlers() {
    document.querySelectorAll(".open-projects-table thead th.sortable").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-sort-key");
        if (sortState.key === key) {
          sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
        } else {
          sortState.key = key;
          sortState.dir = "asc";
        }
        sortRows(allRows);
        updateSortIndicators();
        renderVisible();
      });
    });
    updateSortIndicators();
  }

  function canEdit() {
    return !!(window.currentAccess && window.currentAccess["roadmap-db"] === "editor");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildHealthCell(health) {
    var td = document.createElement("td");
    td.className = "col-health";
    var span = document.createElement("span");
    span.className = "health-tag" + (HEALTH_CLASSES[health] ? " " + HEALTH_CLASSES[health] : "");
    span.title = health ? "Health: " + health : "Health: not set";
    td.appendChild(span);
    return td;
  }

  function buildPhaseCell(phase) {
    var td = document.createElement("td");
    td.className = "col-phase";
    var wrap = document.createElement("span");
    wrap.className = "phase-cell";
    var icon = document.createElement("img");
    icon.className = "phase-icon";
    icon.src = PHASE_ICON_FILES[phase];
    icon.alt = phase;
    wrap.appendChild(icon);
    var label = document.createElement("span");
    label.textContent = phase;
    wrap.appendChild(label);
    td.appendChild(wrap);
    return td;
  }

  function buildActionsCell(row) {
    var td = document.createElement("td");
    if (!canEdit()) return td;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-btn";
    btn.title = "Edit project";
    btn.setAttribute("aria-label", "Edit project");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>' +
      '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
    btn.addEventListener("click", function () { openEditModal(row); });
    td.appendChild(btn);
    return td;
  }

  function teamsInUse() {
    var seen = {};
    allRows.forEach(function (r) { seen[r.team || ""] = true; });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b); });
  }

  function renderTeamFilterChips() {
    var teams = teamsInUse();
    var isAll = teamFilter === null;
    var isNone = !isAll && teamFilter.length === 0;
    var html = '<button type="button" class="filter-chip' + (isAll ? " active" : "") + '" data-filter-all="1">All teams</button>';
    html += '<button type="button" class="filter-chip' + (isNone ? " active" : "") + '" data-filter-none="1">None</button>';
    html += teams.map(function (t) {
      var checked = isAll || teamFilter.indexOf(t) !== -1;
      return '<button type="button" class="filter-chip' + (checked ? " active" : "") + '" data-filter-team="' +
        escapeHtml(t) + '">' + escapeHtml(t || "No team") + "</button>";
    }).join("");
    document.getElementById("teamFilterChips").innerHTML = html;
  }

  function phasesInUse() {
    var present = {};
    allRows.forEach(function (r) { present[r.phase] = true; });
    return PHASE_ORDER.filter(function (p) { return present[p]; });
  }

  function renderPhaseFilterChips() {
    var phases = phasesInUse();
    var isAll = phaseFilter === null;
    var isNone = !isAll && phaseFilter.length === 0;
    var html = '<button type="button" class="filter-chip' + (isAll ? " active" : "") + '" data-filter-all="1">All phases</button>';
    html += '<button type="button" class="filter-chip' + (isNone ? " active" : "") + '" data-filter-none="1">None</button>';
    html += phases.map(function (p) {
      var checked = isAll || phaseFilter.indexOf(p) !== -1;
      return '<button type="button" class="filter-chip' + (checked ? " active" : "") + '" data-filter-phase="' +
        escapeHtml(p) + '">' + escapeHtml(p) + "</button>";
    }).join("");
    document.getElementById("phaseFilterChips").innerHTML = html;
  }

  function pmsInUse() {
    var seen = {};
    allRows.forEach(function (r) { seen[r.pm || ""] = true; });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b); });
  }

  function renderPmFilterChips() {
    var pms = pmsInUse();
    var isAll = pmFilter === null;
    var isNone = !isAll && pmFilter.length === 0;
    var html = '<button type="button" class="filter-chip' + (isAll ? " active" : "") + '" data-filter-all="1">All PMs</button>';
    html += '<button type="button" class="filter-chip' + (isNone ? " active" : "") + '" data-filter-none="1">None</button>';
    html += pms.map(function (p) {
      var checked = isAll || pmFilter.indexOf(p) !== -1;
      return '<button type="button" class="filter-chip' + (checked ? " active" : "") + '" data-filter-pm="' +
        escapeHtml(p) + '">' + escapeHtml(p || "No PM") + "</button>";
    }).join("");
    document.getElementById("pmFilterChips").innerHTML = html;
  }

  function basInUse() {
    var seen = {};
    allRows.forEach(function (r) { seen[r.ba || ""] = true; });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b); });
  }

  function renderBaFilterChips() {
    var bas = basInUse();
    var isAll = baFilter === null;
    var isNone = !isAll && baFilter.length === 0;
    var html = '<button type="button" class="filter-chip' + (isAll ? " active" : "") + '" data-filter-all="1">All BAs</button>';
    html += '<button type="button" class="filter-chip' + (isNone ? " active" : "") + '" data-filter-none="1">None</button>';
    html += bas.map(function (b) {
      var checked = isAll || baFilter.indexOf(b) !== -1;
      return '<button type="button" class="filter-chip' + (checked ? " active" : "") + '" data-filter-ba="' +
        escapeHtml(b) + '">' + escapeHtml(b || "No BA") + "</button>";
    }).join("");
    document.getElementById("baFilterChips").innerHTML = html;
  }

  function updateFiltersCollapseUI() {
    document.getElementById("filtersBlockBody").style.display = filtersCollapsed ? "none" : "";
    var toggle = document.getElementById("filtersCollapseToggle");
    toggle.classList.toggle("collapsed", filtersCollapsed);
    toggle.title = (filtersCollapsed ? "Expand" : "Collapse") + " filters";
  }

  function renderVisible() {
    var rows = allRows.filter(function (r) {
      if (teamFilter !== null && teamFilter.indexOf(r.team || "") === -1) return false;
      if (phaseFilter !== null && phaseFilter.indexOf(r.phase) === -1) return false;
      if (pmFilter !== null && pmFilter.indexOf(r.pm || "") === -1) return false;
      if (baFilter !== null && baFilter.indexOf(r.ba || "") === -1) return false;
      return true;
    });
    render(rows);
  }

  function render(rows) {
    var body = document.getElementById("rowsBody");
    body.innerHTML = "";

    if (!rows.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = 7;
      td0.className = "empty-note";
      td0.textContent = ((phaseFilter !== null || teamFilter !== null || pmFilter !== null || baFilter !== null) && allRows.length)
        ? "No projects match the current filters."
        : "No open projects on the roadmap.";
      tr0.appendChild(td0);
      body.appendChild(tr0);
      return;
    }

    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      tr.appendChild(buildHealthCell(row.health));
      tr.appendChild(buildPhaseCell(row.phase));

      var tdTitle = document.createElement("td");
      tdTitle.className = "project-title";

      var nameEl = document.createElement("div");
      nameEl.className = "project-title-name";
      nameEl.textContent = row.title;
      tdTitle.appendChild(nameEl);

      var people = [row.pm, row.ba, row.sme].filter(Boolean).join(" · ");
      if (people) {
        var peopleEl = document.createElement("div");
        peopleEl.className = "project-people";
        peopleEl.textContent = people;
        tdTitle.appendChild(peopleEl);
      }

      tr.appendChild(tdTitle);

      var tdTeam = document.createElement("td");
      tdTeam.textContent = row.team || "—";
      tr.appendChild(tdTeam);

      var tdStart = document.createElement("td");
      tdStart.textContent = fmtDate(row.start);
      tr.appendChild(tdStart);

      var tdEnd = document.createElement("td");
      tdEnd.textContent = fmtDate(row.end);
      tr.appendChild(tdEnd);

      tr.appendChild(buildActionsCell(row));

      body.appendChild(tr);
    });
  }

  function populateNameDatalist(listEl, field) {
    var seen = {};
    var names = [];
    allRows.forEach(function (r) {
      var v = r[field];
      if (v && !seen[v]) { seen[v] = true; names.push(v); }
    });
    names.sort(function (a, b) { return a.localeCompare(b); });
    listEl.innerHTML = names.map(function (n) {
      return '<option value="' + escapeHtml(n) + '"></option>';
    }).join("");
  }

  function openEditModal(row) {
    var HEALTH_OPTIONS = ["", "Green", "Amber", "Red"];
    var HEALTH_LABELS = { "": "Not set", Green: "Green", Amber: "Amber", Red: "Red" };

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    var dialog = document.createElement("div");
    dialog.className = "modal-dialog";
    dialog.innerHTML =
      "<h3>Edit “" + escapeHtml(row.title) + "”</h3>" +
      '<div class="modal-field"><label for="editHealth">Health</label><select id="editHealth"></select></div>' +
      '<div class="modal-field"><label for="editPhase">Phase</label><select id="editPhase"></select></div>' +
      '<div class="modal-field"><label for="editTeam">Team</label><select id="editTeam"></select></div>' +
      '<div class="modal-field"><label for="editPm">PM</label><input type="text" id="editPm" list="editPmList" autocomplete="off" /><datalist id="editPmList"></datalist></div>' +
      '<div class="modal-field"><label for="editBa">BA</label><input type="text" id="editBa" list="editBaList" autocomplete="off" /><datalist id="editBaList"></datalist></div>' +
      '<div class="modal-field"><label for="editSme">SME</label><input type="text" id="editSme" /></div>' +
      '<div class="modal-error" id="editError"></div>' +
      '<div class="modal-actions"><button type="button" class="btn" id="editCancelBtn">Cancel</button>' +
      '<button type="button" class="btn btn-primary" id="editSaveBtn">Save</button></div>';

    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    var healthSelect = dialog.querySelector("#editHealth");
    HEALTH_OPTIONS.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt;
      o.textContent = HEALTH_LABELS[opt];
      healthSelect.appendChild(o);
    });
    healthSelect.value = row.health || "";

    var phaseSelect = dialog.querySelector("#editPhase");
    PHASE_ORDER.forEach(function (p) {
      var o = document.createElement("option");
      o.value = p;
      o.textContent = p;
      phaseSelect.appendChild(o);
    });
    phaseSelect.value = row.phase;

    var teamSelect = dialog.querySelector("#editTeam");
    var blankTeamOption = document.createElement("option");
    blankTeamOption.value = "";
    blankTeamOption.textContent = "—";
    teamSelect.appendChild(blankTeamOption);
    TEAM_OPTIONS.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t;
      o.textContent = t;
      teamSelect.appendChild(o);
    });
    teamSelect.value = row.team || "";

    var pmInput = dialog.querySelector("#editPm");
    pmInput.value = row.pm || "";
    populateNameDatalist(dialog.querySelector("#editPmList"), "pm");

    var baInput = dialog.querySelector("#editBa");
    baInput.value = row.ba || "";
    populateNameDatalist(dialog.querySelector("#editBaList"), "ba");

    var smeInput = dialog.querySelector("#editSme");
    smeInput.value = row.sme || "";

    var errorEl = dialog.querySelector("#editError");
    var saveBtn = dialog.querySelector("#editSaveBtn");
    var cancelBtn = dialog.querySelector("#editCancelBtn");

    function close() {
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
    }
    function onKeydown(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKeydown);
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) close(); });
    cancelBtn.addEventListener("click", close);

    saveBtn.addEventListener("click", function () {
      var newHealth = healthSelect.value;
      var newPhase = phaseSelect.value;
      var newTeam = teamSelect.value;
      var newPm = pmInput.value.trim();
      var newBa = baInput.value.trim();
      var newSme = smeInput.value.trim();

      saveBtn.disabled = true;
      errorEl.textContent = "";

      Promise.all([
        sb.from("roadmap_tasks")
          .update({ health: newHealth || null, phase: newPhase, team: newTeam || null })
          .eq("id", row.id),
        sb.from("projects")
          .update({ pm: newPm || null, ba: newBa || null, sme: newSme || null, updated_at: new Date().toISOString() })
          .eq("id", row.projectId)
      ]).then(function (results) {
        var failed = results.find(function (res) { return res.error; });
        if (failed) {
          saveBtn.disabled = false;
          errorEl.textContent = "Couldn't save: " + failed.error.message;
          return;
        }
        row.health = newHealth;
        row.phase = newPhase;
        row.team = newTeam;
        row.pm = newPm;
        row.ba = newBa;
        row.sme = newSme;
        sortRows(allRows);
        renderPhaseFilterChips();
        renderTeamFilterChips();
        renderPmFilterChips();
        renderBaFilterChips();
        renderVisible();
        close();
      });
    });

    setTimeout(function () { healthSelect.focus(); }, 0);
  }

  function load() {
    sb.from("roadmap_tasks")
      .select("id, name, start_date, duration_weeks, team, phase, health, project_id, projects!inner(canonical_name, status, pm, ba, sme)")
      .eq("projects.status", "open")
      .then(function (res) {
        if (res.error) {
          showError("Couldn't load open projects: " + res.error.message);
          return;
        }
        showError("");

        var rows = (res.data || []).map(function (r) {
          var phase = normalizedPhase(r.phase);
          var start = parseIsoDate(r.start_date);
          var durationWeeks = Math.max(1, parseInt(r.duration_weeks, 10) || 1);
          var end = start ? addDays(start, durationWeeks * 7 - 1) : null;
          return {
            id: r.id,
            projectId: r.project_id,
            title: (r.projects && r.projects.canonical_name) || r.name || "Untitled",
            team: r.team || "",
            health: r.health || "",
            phase: phase,
            start: start,
            end: end,
            pm: (r.projects && r.projects.pm) || "",
            ba: (r.projects && r.projects.ba) || "",
            sme: (r.projects && r.projects.sme) || ""
          };
        });

        sortRows(rows);
        allRows = rows;
        renderPhaseFilterChips();
        renderTeamFilterChips();
        renderPmFilterChips();
        renderBaFilterChips();
        renderVisible();
      });
  }

  document.getElementById("phaseFilterChips").addEventListener("click", function (e) {
    var chip = e.target.closest(".filter-chip");
    if (!chip) return;
    var allPhases = phasesInUse();
    if (chip.dataset.filterAll) {
      phaseFilter = null;
    } else if (chip.dataset.filterNone) {
      phaseFilter = [];
    } else {
      var name = chip.dataset.filterPhase;
      var current = phaseFilter === null ? allPhases.slice() : phaseFilter.slice();
      var idx = current.indexOf(name);
      if (idx === -1) current.push(name); else current.splice(idx, 1);
      phaseFilter = current.length === allPhases.length ? null : current;
    }
    renderPhaseFilterChips();
    renderVisible();
  });

  document.getElementById("teamFilterChips").addEventListener("click", function (e) {
    var chip = e.target.closest(".filter-chip");
    if (!chip) return;
    var allTeams = teamsInUse();
    if (chip.dataset.filterAll) {
      teamFilter = null;
    } else if (chip.dataset.filterNone) {
      teamFilter = [];
    } else {
      var name = chip.dataset.filterTeam;
      var current = teamFilter === null ? allTeams.slice() : teamFilter.slice();
      var idx = current.indexOf(name);
      if (idx === -1) current.push(name); else current.splice(idx, 1);
      teamFilter = current.length === allTeams.length ? null : current;
    }
    renderTeamFilterChips();
    renderVisible();
  });

  document.getElementById("pmFilterChips").addEventListener("click", function (e) {
    var chip = e.target.closest(".filter-chip");
    if (!chip) return;
    var allPms = pmsInUse();
    if (chip.dataset.filterAll) {
      pmFilter = null;
    } else if (chip.dataset.filterNone) {
      pmFilter = [];
    } else {
      var name = chip.dataset.filterPm;
      var current = pmFilter === null ? allPms.slice() : pmFilter.slice();
      var idx = current.indexOf(name);
      if (idx === -1) current.push(name); else current.splice(idx, 1);
      pmFilter = current.length === allPms.length ? null : current;
    }
    renderPmFilterChips();
    renderVisible();
  });

  document.getElementById("baFilterChips").addEventListener("click", function (e) {
    var chip = e.target.closest(".filter-chip");
    if (!chip) return;
    var allBas = basInUse();
    if (chip.dataset.filterAll) {
      baFilter = null;
    } else if (chip.dataset.filterNone) {
      baFilter = [];
    } else {
      var name = chip.dataset.filterBa;
      var current = baFilter === null ? allBas.slice() : baFilter.slice();
      var idx = current.indexOf(name);
      if (idx === -1) current.push(name); else current.splice(idx, 1);
      baFilter = current.length === allBas.length ? null : current;
    }
    renderBaFilterChips();
    renderVisible();
  });

  document.getElementById("filtersCollapseToggle").addEventListener("click", function () {
    filtersCollapsed = !filtersCollapsed;
    try { localStorage.setItem("projects-listing-filters-collapsed", filtersCollapsed ? "1" : "0"); } catch (err) {}
    updateFiltersCollapseUI();
  });

  updateFiltersCollapseUI();

  attachSortHandlers();

  function init() {
    sb = window.sbClient;
    load();
  }

  window.onAuthReady(init);
})();
</script>
</body>
</html>
