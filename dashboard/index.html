<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  /* Colours and fonts come from /shared/theme.css */
  :root {
    --accent-contrast: #FFFFFF;
    --accent-tint: #2A78D61A;
    --danger-tint: #D03B3B1A;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.06), 0 1px 1px rgba(20, 24, 30, 0.04);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page-plane); color: var(--text-primary);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }

  .dash-app {
    height: 100vh; padding-top: 34px; display: flex; flex-direction: column;
  }

  .tabbar {
    display: flex; align-items: flex-end; gap: 4px;
    padding: 10px 14px 0; flex: none;
  }
  .tab {
    font: inherit; font-size: 13px; font-weight: 500; line-height: 1;
    padding: 11px 20px; border: 1px solid var(--baseline); border-bottom: none;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--panel-alt); color: var(--text-secondary);
    cursor: pointer; position: relative; top: 1px;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--surface-1); color: var(--text-primary); font-weight: 600;
    box-shadow: 0 -1px 3px rgba(20, 24, 30, 0.04);
  }

  .tab-content {
    flex: 1; min-height: 0; background: var(--surface-1);
    border-top: 1px solid var(--baseline);
  }
  .tab-panel { display: none; width: 100%; height: 100%; border: 0; }
  .tab-panel.active { display: block; }

  .load-note {
    display: flex; align-items: center; justify-content: center; height: 100%;
    font-size: 13px; color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="dash-app">
  <div class="tabbar" id="tabbar" role="tablist">
    <button type="button" class="tab active" role="tab" data-tab="projects">Projects</button>
    <button type="button" class="tab" role="tab" data-tab="releases">Releases</button>
    <button type="button" class="tab" role="tab" data-tab="kpis">KPIs</button>
  </div>
  <div class="tab-content">
    <iframe class="tab-panel active" data-tab="projects" src="../project-list/index.html?embed=1" title="Projects"></iframe>
    <iframe class="tab-panel" data-tab="releases" data-src="../roadmap/releases.html?embed=1" title="Releases"></iframe>
    <iframe class="tab-panel" data-tab="kpis" data-src="../intake/kpis.html?embed=1" title="KPIs"></iframe>
  </div>
</div>

<script>window.AUTH_REQUIREMENTS = [
  { project: 'roadmap-db', role: 'viewer' },
  { project: 'intake', role: 'viewer' }
];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/auth-gate.js"></script>
<script src="/app-tabs.js"></script>
<script>
(function () {
  "use strict";

  // The Projects iframe has its src set directly in the markup (loads with
  // the rest of the page, same as any normal iframe). Releases/KPIs load
  // lazily here, the first time their tab is clicked, via data-src.
  document.getElementById("tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    var name = btn.dataset.tab;

    document.querySelectorAll(".tab").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    document.querySelectorAll(".tab-panel").forEach(function (panel) {
      var isActive = panel.dataset.tab === name;
      panel.classList.toggle("active", isActive);
      if (isActive && !panel.getAttribute("src") && panel.dataset.src) {
        panel.setAttribute("src", panel.dataset.src);
      }
    });
  });
})();
</script>
</body>
</html>
