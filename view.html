<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects View</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #EAEDF1;
    --surface: #FFFFFF;
    --surface-alt: #F2F4F7;
    --border: #DBE0E7;
    --text: #191D23;
    --text-muted: #5E6572;
    --text-faint: #9BA1AC;
    --accent: #0E7A6C;
    --accent-contrast: #FFFFFF;
    --accent-tint: #0E7A6C1A;
    --danger: #C0362C;
    --danger-tint: #C0362C1A;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.06), 0 1px 1px rgba(20, 24, 30, 0.04);

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C; --surface: #1C2027; --surface-alt: #20242C; --border: #2C313B;
      --text: #E8EAED; --text-muted: #99A0AC; --text-faint: #6B717C;
      --accent: #3FC7B3; --accent-contrast: #0A1512; --accent-tint: #3FC7B326;
      --danger: #F0685F; --danger-tint: #F0685F26;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C; --surface: #1C2027; --surface-alt: #20242C; --border: #2C313B;
    --text: #E8EAED; --text-muted: #99A0AC; --text-faint: #6B717C;
    --accent: #3FC7B3; --accent-contrast: #0A1512; --accent-tint: #3FC7B326;
    --danger: #F0685F; --danger-tint: #F0685F26;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] {
    --bg: #EAEDF1; --surface: #FFFFFF; --surface-alt: #F2F4F7; --border: #DBE0E7;
    --text: #191D23; --text-muted: #5E6572; --text-faint: #9BA1AC;
    --accent: #0E7A6C; --accent-contrast: #FFFFFF; --accent-tint: #0E7A6C1A;
    --danger: #C0362C; --danger-tint: #C0362C1A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }

  .app { min-height: 100vh; display: flex; flex-direction: column; padding-top: 34px; }
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
    flex: none; flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--font-display); font-weight: 400; font-size: 22px;
    letter-spacing: 0.2px; margin: 0;
  }
  .topbar .sub { font-size: 12.5px; color: var(--text-muted); margin-left: 10px; }

  .main { flex: 1; display: flex; justify-content: center; padding: 28px 24px 60px; }
  .panel { width: 100%; max-width: 1200px; }

  .notice {
    border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; font-size: 13.5px;
    line-height: 1.5;
  }
  .notice-error { background: var(--danger-tint); border: 1px solid var(--danger); color: var(--danger); }
  .notice-hidden { display: none; }

  .phase-filter {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
  }
  .phase-filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px 6px 10px; font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .phase-filter-chip input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  .phase-filter-chip.is-off { opacity: 0.55; }
  .phase-filter-chip img { width: 13px; height: 13px; }
  :root[data-theme="dark"] .phase-filter-chip img { filter: invert(1) brightness(1.7); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .phase-filter-chip img { filter: invert(1) brightness(1.7); }
  }

  .projects-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  table.open-projects-table { width: 100%; border-collapse: collapse; }
  .open-projects-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint); font-weight: 600; padding: 10px 14px;
    border-bottom: 1px solid var(--border); background: var(--surface-alt); white-space: nowrap;
  }
  .open-projects-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .open-projects-table tr:last-child td { border-bottom: none; }
  .open-projects-table td.col-health { width: 1%; }
  .open-projects-table td.col-phase { white-space: nowrap; }
  .open-projects-table td.col-visibility, .open-projects-table th.col-visibility { width: 1%; text-align: center; }
  .open-projects-table tr.row-hidden { opacity: 0.5; }
  .visibility-toggle {
    background: none; border: none; padding: 4px; cursor: pointer; color: var(--text-muted);
    display: inline-flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .visibility-toggle:hover { background: var(--surface-alt); color: var(--text); }
  .open-projects-table th.sortable { cursor: pointer; user-select: none; }
  .open-projects-table th.sortable:hover { color: var(--text-muted); }
  .open-projects-table th.sortable.active { color: var(--accent); }
  .sort-arrow { display: inline-block; width: 10px; margin-left: 4px; font-size: 9px; color: var(--accent); }
  .project-title-name { font-weight: 500; }
  .empty-note { padding: 20px 16px; font-size: 13px; color: var(--text-faint); font-style: italic; }

  .health-tag {
    display: inline-block; width: 7px; height: 18px; border-radius: 3px;
    background: var(--border);
  }
  .health-green { background: #4FCE65; }
  .health-amber { background: #FFC148; }
  .health-red { background: #FF4853; }

  .phase-cell { display: inline-flex; align-items: center; gap: 7px; }
  .phase-icon { width: 14px; height: 14px; flex: none; }
  :root[data-theme="dark"] .phase-icon { filter: invert(1) brightness(1.7); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .phase-icon { filter: invert(1) brightness(1.7); }
  }

  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn:disabled { opacity: .55; cursor: default; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Technology Projects</h1><span class="sub">Technology project list: Health, Phase, Title, planned Start Date, and Delivery month.  Tap a heading to sort.  Tap heading to change sort order.</span>
    </div>
    <button type="button" class="btn" id="publishBtn">Publish</button>
  </div>

  <div class="main">
    <div class="panel">
      <div id="loadError" class="notice notice-error notice-hidden"></div>

      <div class="phase-filter" id="phaseFilter"></div>

      <div class="projects-card">
        <table class="open-projects-table">
          <thead>
            <tr>
              <th class="sortable" data-sort-key="health">Health<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="phase">Phase<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="title">Title<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="start">Start<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort-key="delivery">Delivery<span class="sort-arrow"></span></th>
              <th class="col-visibility"><span class="sr-only">Show/Hide</span></th>
            </tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>window.AUTH_REQUIREMENTS = [{ project: 'roadmap-db', role: 'viewer' }];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-gate.js"></script>
<script>
(function () {
  "use strict";

  var PHASE_ORDER = ["Not Started", "Discovery", "Build", "Test", "Blocked", "Complete"];
  var DEFAULT_PHASE = "Not Started";
  var PHASE_ICON_FILES = {
    "Not Started": "circle-0.svg",
    "Discovery": "circle-2.svg",
    "Build": "circle-4.svg",
    "Test": "circle-6.svg",
    "Blocked": "circle-blocked.svg",
    "Complete": "circle-8.svg"
  };
  var HEALTH_CLASSES = { Green: "health-green", Amber: "health-amber", Red: "health-red" };

  var HEALTH_ORDER = ["", "Green", "Amber", "Red"];
  var SORT_FALLBACK_CHAIN = ["phase", "start", "title"];

  var EYE_OPEN_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_CLOSED_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 6.6C3.9 8.4 1 12 1 12s4 7 11 7c2 0 3.7-.5 5.1-1.3M10.6 5.1A11 11 0 0 1 12 5c7 0 11 7 11 7a17.7 17.7 0 0 1-3.2 4.2"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';

  var sb;
  var allRows = [];
  var sortState = { key: "phase", dir: "desc" };
  var phaseFilterState = {};
  PHASE_ORDER.forEach(function (phase) { phaseFilterState[phase] = true; });

  function normalizedPhase(phase) {
    return PHASE_ORDER.indexOf(phase) !== -1 ? phase : DEFAULT_PHASE;
  }

  function parseIsoDate(s) {
    var parts = String(s || "").split("-");
    if (parts.length !== 3) return null;
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return null;
    var date = new Date(y, m - 1, d);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function addDays(date, days) {
    var d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function fmtDate(d) {
    if (!d) return "—";
    return d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  }

  function fmtDelivery(d) {
    if (!d) return "TBC";
    return d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  }

  function deliveryDate(start, durationWeeks) {
    if (!start) return null;
    var weeks = Number(durationWeeks);
    if (!isFinite(weeks)) weeks = 0;
    return addDays(start, weeks * 7);
  }

  function showError(msg) {
    var el = document.getElementById("loadError");
    el.textContent = msg;
    el.classList.toggle("notice-hidden", !msg);
  }

  function dateVal(d) {
    return d ? d.getTime() : Infinity;
  }

  function compareRaw(a, b, key) {
    switch (key) {
      case "health": return HEALTH_ORDER.indexOf(a.health) - HEALTH_ORDER.indexOf(b.health);
      case "phase": return PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase);
      case "title": return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
      case "start": return dateVal(a.start) - dateVal(b.start);
      case "delivery": return dateVal(a.delivery) - dateVal(b.delivery);
      default: return 0;
    }
  }

  function sortRows(rows) {
    var chain = [sortState.key];
    SORT_FALLBACK_CHAIN.forEach(function (k) {
      if (chain.indexOf(k) === -1) chain.push(k);
    });

    rows.sort(function (a, b) {
      for (var i = 0; i < chain.length; i++) {
        var key = chain[i];
        var dir = key === sortState.key ? sortState.dir : "asc";
        var diff = compareRaw(a, b, key);
        if (dir === "desc") diff = -diff;
        if (diff !== 0) return diff;
      }
      return 0;
    });
    return rows;
  }

  function updateSortIndicators() {
    document.querySelectorAll(".open-projects-table thead th.sortable").forEach(function (th) {
      var key = th.getAttribute("data-sort-key");
      var arrow = th.querySelector(".sort-arrow");
      th.classList.toggle("active", key === sortState.key);
      arrow.textContent = key === sortState.key ? (sortState.dir === "asc" ? "▲" : "▼") : "";
    });
  }

  function attachSortHandlers() {
    document.querySelectorAll(".open-projects-table thead th.sortable").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-sort-key");
        if (sortState.key === key) {
          sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
        } else {
          sortState.key = key;
          sortState.dir = "asc";
        }
        sortRows(allRows);
        updateSortIndicators();
        render(allRows);
      });
    });
    updateSortIndicators();
  }

  function buildHealthCell(health) {
    var td = document.createElement("td");
    td.className = "col-health";
    var span = document.createElement("span");
    span.className = "health-tag" + (HEALTH_CLASSES[health] ? " " + HEALTH_CLASSES[health] : "");
    span.title = health ? "Health: " + health : "Health: not set";
    td.appendChild(span);
    return td;
  }

  function buildPhaseCell(phase) {
    var td = document.createElement("td");
    td.className = "col-phase";
    var wrap = document.createElement("span");
    wrap.className = "phase-cell";
    var icon = document.createElement("img");
    icon.className = "phase-icon";
    icon.src = PHASE_ICON_FILES[phase];
    icon.alt = phase;
    wrap.appendChild(icon);
    var label = document.createElement("span");
    label.textContent = phase;
    wrap.appendChild(label);
    td.appendChild(wrap);
    return td;
  }

  function render(rows) {
    var body = document.getElementById("rowsBody");
    body.innerHTML = "";

    if (!rows.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = 6;
      td0.className = "empty-note";
      td0.textContent = "No open projects on the roadmap.";
      tr0.appendChild(td0);
      body.appendChild(tr0);
      return;
    }

    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      tr.classList.toggle("row-hidden", !!row.hidden);
      tr.appendChild(buildHealthCell(row.health));
      tr.appendChild(buildPhaseCell(row.phase));

      var tdTitle = document.createElement("td");
      tdTitle.className = "project-title-name";
      tdTitle.textContent = row.title;
      tr.appendChild(tdTitle);

      var tdStart = document.createElement("td");
      tdStart.textContent = fmtDate(row.start);
      tr.appendChild(tdStart);

      var tdDelivery = document.createElement("td");
      tdDelivery.textContent = fmtDelivery(row.delivery);
      tr.appendChild(tdDelivery);

      var tdVisibility = document.createElement("td");
      tdVisibility.className = "col-visibility";
      var eyeBtn = document.createElement("button");
      eyeBtn.type = "button";
      eyeBtn.className = "visibility-toggle";
      eyeBtn.setAttribute("aria-label", row.hidden ? "Hidden from publish. Click to show." : "Visible in publish. Click to hide.");
      eyeBtn.title = row.hidden ? "Hidden from publish — click to show" : "Visible in publish — click to hide";
      eyeBtn.innerHTML = row.hidden ? EYE_CLOSED_SVG : EYE_OPEN_SVG;
      eyeBtn.addEventListener("click", function () {
        row.hidden = !row.hidden;
        render(allRows);
      });
      tdVisibility.appendChild(eyeBtn);
      tr.appendChild(tdVisibility);

      body.appendChild(tr);
    });
  }

  function applyPhaseFilter() {
    allRows.forEach(function (row) {
      row.hidden = !phaseFilterState[row.phase];
    });
    render(allRows);
  }

  function buildPhaseFilter() {
    var wrap = document.getElementById("phaseFilter");
    wrap.innerHTML = "";
    PHASE_ORDER.forEach(function (phase) {
      var label = document.createElement("label");
      label.className = "phase-filter-chip";

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = phaseFilterState[phase];
      checkbox.addEventListener("change", function () {
        phaseFilterState[phase] = checkbox.checked;
        label.classList.toggle("is-off", !checkbox.checked);
        applyPhaseFilter();
      });
      label.appendChild(checkbox);

      var icon = document.createElement("img");
      icon.src = PHASE_ICON_FILES[phase];
      icon.alt = "";
      label.appendChild(icon);

      var text = document.createElement("span");
      text.textContent = phase;
      label.appendChild(text);

      wrap.appendChild(label);
    });
  }

  function load() {
    sb.from("roadmap_tasks")
      .select("id, name, start_date, duration_weeks, phase, health, project_id, projects!inner(canonical_name, status)")
      .eq("projects.status", "open")
      .then(function (res) {
        if (res.error) {
          showError("Couldn't load open projects: " + res.error.message);
          return;
        }
        showError("");

        var rows = (res.data || []).map(function (r) {
          var phase = normalizedPhase(r.phase);
          var start = parseIsoDate(r.start_date);
          return {
            id: r.id,
            title: (r.projects && r.projects.canonical_name) || r.name || "Untitled",
            health: r.health || "",
            phase: phase,
            start: start,
            delivery: deliveryDate(start, r.duration_weeks),
            hidden: !phaseFilterState[phase]
          };
        });

        sortRows(rows);
        allRows = rows;
        render(allRows);
      });
  }

  attachSortHandlers();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildStandaloneHtml(rows) {
    var iconDataUris = PHASE_ICON_DATA_URIS;
    var rowData = rows.map(function (row) {
      return {
        health: row.health,
        healthKey: HEALTH_ORDER.indexOf(row.health),
        phase: row.phase,
        phaseKey: PHASE_ORDER.indexOf(row.phase),
        title: row.title,
        titleKey: row.title.toLowerCase(),
        start: fmtDate(row.start),
        startKey: row.start ? row.start.getTime() : Infinity,
        delivery: fmtDelivery(row.delivery),
        deliveryKey: row.delivery ? row.delivery.getTime() : Infinity
      };
    });

    var css = document.querySelector("style").textContent;

    var html = [];
    html.push("<!DOCTYPE html>");
    html.push('<html lang="en">');
    html.push("<head>");
    html.push('<meta charset="UTF-8" />');
    html.push('<meta name="viewport" content="width=device-width, initial-scale=1.0" />');
    html.push("<title>Technology Projects</title>");
    html.push("<style>" + css + "</style>");
    html.push("</head>");
    html.push("<body>");
    html.push('<div class="app" style="padding-top:0">');
    html.push('<div class="topbar"><div><h1>Technology Projects</h1><span class="sub">Technology project list: Health, Phase, Title, planned Start Date, and Delivery month. Tap a heading to sort. Generated ' +
      escapeHtml(new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })) + '.</span></div></div>');
    html.push('<div class="main"><div class="panel">');
    html.push('<div class="projects-card"><table class="open-projects-table"><thead><tr>');
    html.push('<th class="sortable" data-sort-key="health">Health<span class="sort-arrow"></span></th>');
    html.push('<th class="sortable" data-sort-key="phase">Phase<span class="sort-arrow"></span></th>');
    html.push('<th class="sortable" data-sort-key="title">Title<span class="sort-arrow"></span></th>');
    html.push('<th class="sortable" data-sort-key="start">Start<span class="sort-arrow"></span></th>');
    html.push('<th class="sortable" data-sort-key="delivery">Delivery<span class="sort-arrow"></span></th>');
    html.push("</tr></thead><tbody id=\"rowsBody\"></tbody></table></div>");
    html.push("</div></div></div>");

    html.push("<script>");
    html.push("var ROWS = " + JSON.stringify(rowData) + ";");
    html.push("var ICONS = " + JSON.stringify(iconDataUris) + ";");
    html.push("var HEALTH_CLASSES = " + JSON.stringify(HEALTH_CLASSES) + ";");
    html.push("var sortState = " + JSON.stringify(sortState) + ";");
    html.push("var SORT_FALLBACK_CHAIN = " + JSON.stringify(SORT_FALLBACK_CHAIN) + ";");
    html.push([
      "function compareRaw(a, b, key) {",
      "  switch (key) {",
      "    case 'health': return a.healthKey - b.healthKey;",
      "    case 'phase': return a.phaseKey - b.phaseKey;",
      "    case 'title': return a.titleKey.localeCompare(b.titleKey);",
      "    case 'start': return a.startKey - b.startKey;",
      "    case 'delivery': return a.deliveryKey - b.deliveryKey;",
      "    default: return 0;",
      "  }",
      "}",
      "function sortRows(rows) {",
      "  var chain = [sortState.key];",
      "  SORT_FALLBACK_CHAIN.forEach(function (k) { if (chain.indexOf(k) === -1) chain.push(k); });",
      "  rows.sort(function (a, b) {",
      "    for (var i = 0; i < chain.length; i++) {",
      "      var key = chain[i];",
      "      var dir = key === sortState.key ? sortState.dir : 'asc';",
      "      var diff = compareRaw(a, b, key);",
      "      if (dir === 'desc') diff = -diff;",
      "      if (diff !== 0) return diff;",
      "    }",
      "    return 0;",
      "  });",
      "  return rows;",
      "}",
      "function updateSortIndicators() {",
      "  document.querySelectorAll('.open-projects-table thead th.sortable').forEach(function (th) {",
      "    var key = th.getAttribute('data-sort-key');",
      "    var arrow = th.querySelector('.sort-arrow');",
      "    th.classList.toggle('active', key === sortState.key);",
      "    arrow.textContent = key === sortState.key ? (sortState.dir === 'asc' ? '▲' : '▼') : '';",
      "  });",
      "}",
      "function render(rows) {",
      "  var body = document.getElementById('rowsBody');",
      "  body.innerHTML = '';",
      "  rows.forEach(function (row) {",
      "    var tr = document.createElement('tr');",
      "    var tdHealth = document.createElement('td');",
      "    tdHealth.className = 'col-health';",
      "    var span = document.createElement('span');",
      "    span.className = 'health-tag' + (HEALTH_CLASSES[row.health] ? ' ' + HEALTH_CLASSES[row.health] : '');",
      "    span.title = row.health ? 'Health: ' + row.health : 'Health: not set';",
      "    tdHealth.appendChild(span);",
      "    tr.appendChild(tdHealth);",
      "    var tdPhase = document.createElement('td');",
      "    tdPhase.className = 'col-phase';",
      "    var wrap = document.createElement('span');",
      "    wrap.className = 'phase-cell';",
      "    var icon = document.createElement('img');",
      "    icon.className = 'phase-icon';",
      "    icon.src = ICONS[row.phase];",
      "    icon.alt = row.phase;",
      "    wrap.appendChild(icon);",
      "    var label = document.createElement('span');",
      "    label.textContent = row.phase;",
      "    wrap.appendChild(label);",
      "    tdPhase.appendChild(wrap);",
      "    tr.appendChild(tdPhase);",
      "    var tdTitle = document.createElement('td');",
      "    tdTitle.className = 'project-title-name';",
      "    tdTitle.textContent = row.title;",
      "    tr.appendChild(tdTitle);",
      "    var tdStart = document.createElement('td');",
      "    tdStart.textContent = row.start;",
      "    tr.appendChild(tdStart);",
      "    var tdDelivery = document.createElement('td');",
      "    tdDelivery.textContent = row.delivery;",
      "    tr.appendChild(tdDelivery);",
      "    body.appendChild(tr);",
      "  });",
      "}",
      "document.querySelectorAll('.open-projects-table thead th.sortable').forEach(function (th) {",
      "  th.addEventListener('click', function () {",
      "    var key = th.getAttribute('data-sort-key');",
      "    if (sortState.key === key) { sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc'; }",
      "    else { sortState.key = key; sortState.dir = 'asc'; }",
      "    sortRows(ROWS); updateSortIndicators(); render(ROWS);",
      "  });",
      "});",
      "sortRows(ROWS); updateSortIndicators(); render(ROWS);"
    ].join("\n"));
    html.push("</" + "script>");
    html.push("</body></html>");
    return html.join("\n");
  }

  function publishStandalone() {
    var btn = document.getElementById("publishBtn");
    btn.disabled = true;
    var originalLabel = btn.textContent;
    btn.textContent = "Publishing…";
    try {
      var visibleRows = allRows.filter(function (row) { return !row.hidden; });
      var htmlStr = buildStandaloneHtml(visibleRows);
      var blob = new Blob([htmlStr], { type: "text/html;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "project-list.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      showError("Couldn't publish: " + err.message);
    }
    btn.disabled = false;
    btn.textContent = originalLabel;
  }

  document.getElementById("publishBtn").addEventListener("click", publishStandalone);

  function init() {
    sb = window.sbClient;
    buildPhaseFilter();
    load();
  }

  window.onAuthReady(init);
})();
</script>
</body>
